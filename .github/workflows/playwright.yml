name: Deposit Onboarding Portal Smoke Check

# Manual trigger: run this in the ~hour before a demo to get a go/no-go.
# Also runs on pushes to main so a bad deploy is caught without anyone
# having to remember to trigger it by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    name: Consumer + Entity smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CONSUMER_URL: ${{ secrets.CONSUMER_URL }}
      CONSUMER_CODE: ${{ secrets.CONSUMER_CODE }}
      ENTITY_URL: ${{ secrets.ENTITY_URL }}
      ENTITY_CODE: ${{ secrets.ENTITY_CODE }}
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (the only project we run)
        run: npx playwright install --with-deps chromium

      - name: Prepare results directory
        run: mkdir -p test-results

      - name: Run smoke suite
        id: run_tests
        # Don't let a failing test kill the job before we can summarize it
        continue-on-error: true
        run: npm run test:smoke -- --reporter=list,json
        # Playwright's json reporter writes to the path below via env var
        # so it doesn't depend on playwright.config.ts having it wired in.
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json

      - name: Write go/no-go summary
        if: always()
        run: |
          echo "## Deposit Onboarding Portal Smoke Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            echo "###  SAFE TO DEMO — both flows passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "###  DO NOT DEMO — at least one flow failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ -f test-results/results.json ]; then
            node -e "
              const r = require('./test-results/results.json');
              const rows = [];
              const walk = (suite) => {
                (suite.specs || []).forEach(spec => {
                  const persona = /entity/i.test(spec.file) ? 'Entity' : 'Consumer';
                  const ok = spec.tests.every(t => t.results.every(res => res.status === 'passed'));
                  rows.push(\`| \${persona} | \${ok ? ' Pass' : ' Fail'} |\`);
                });
                (suite.suites || []).forEach(walk);
              };
              r.suites.forEach(walk);
              console.log(rows.join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| — | Report not generated |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Fail the job if tests failed
        if: steps.run_tests.outcome != 'success'
        run: exit 1